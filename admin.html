<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Jing Chen</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Jing Chen 的个人网站文章管理后台。 / Blog admin for Jing Chen's personal site." />
  <link rel="icon" href="assets/img/avatar.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* ---- Admin layout (tool page, deliberately not in the site nav) ---- */
    body { background: var(--bg-soft); }

    .admin-bar {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .admin-bar h1 { font-size: 1.3rem; margin: 0; }

    .admin-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px 80px;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .admin-side { display: flex; flex-direction: column; gap: 20px; }
    .admin-main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
    }
    .card h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
      margin: 0 0 14px;
      font-weight: 700;
    }

    /* ---- Token ---- */
    #token { width: 100%; box-sizing: border-box; padding: 8px 10px; font-family: monospace; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .hint { font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; margin: 10px 0 0; }

    /* ---- Buttons ---- */
    .btn {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn:hover { opacity: 0.9; }
    .btn-ghost {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-ghost:hover { background: var(--bg-soft); }
    .btn.danger { background: #b3261e; border-color: #b3261e; }

    /* ---- Post list ---- */
    #postList { list-style: none; margin: 0; padding: 0; }
    #postList li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.9rem;
    }
    #postList li:last-child { border-bottom: none; }
    #postList .pl-date { color: var(--text-faint); font-size: 0.8rem; white-space: nowrap; }
    #postList .pl-actions { display: flex; gap: 6px; flex: none; }
    #postList button {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      padding: 2px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    #postList button:hover { color: var(--text); background: var(--bg-soft); }
    #postList button.del:hover { color: #b3261e; border-color: #b3261e; }

    /* ---- Form ---- */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.span2 { grid-column: 1 / -1; }
    .field label { font-size: 0.8rem; color: var(--text-muted); }
    .field input, .field textarea {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      box-sizing: border-box;
      width: 100%;
    }
    .field textarea { resize: vertical; }

    /* ---- Editor ---- */
    .lang-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .lang-tabs button {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      padding: 5px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .lang-tabs button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: stretch;
    }
    .editor {
      width: 100%;
      min-height: 420px;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      resize: vertical;
    }
    .preview {
      width: 100%;
      min-height: 420px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
    }

    /* ---- Actions / status ---- */
    .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status { font-size: 0.9rem; color: var(--text-muted); }
    .status.err { color: #b3261e; }
    .status.ok { color: #1a7f37; }
    .warn {
      background: #fff8e1;
      border: 1px solid #f0d48a;
      border-radius: 8px;
      color: #7a5c00;
      padding: 12px 16px;
      font-size: 0.9rem;
    }

    /* ---- Main tabs: Posts / Settings ---- */
    .main-tabs { display: flex; gap: 4px; }
    .main-tabs button {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      padding: 8px 22px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .main-tabs button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* ---- Settings ---- */
    .contact-row {
      display: grid;
      grid-template-columns: 120px 1fr 1fr auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .contact-row select, .contact-row input {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      box-sizing: border-box;
      width: 100%;
    }
    .contact-row .btn-ghost { padding: 6px 12px; }
    .avatar-preview {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--bg-soft);
    }
    .avatar-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

    @media (max-width: 900px) {
      .admin-grid { grid-template-columns: 1fr; }
      .editor-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="admin-bar">
    <h1>Admin / 管理后台</h1>
    <nav>
      <a href="index.html" target="_blank" rel="noopener">View site / 查看网站</a>
    </nav>
  </header>

  <div class="admin-grid">
    <aside class="admin-side">
      <section class="card">
        <h2>GitHub Token / 令牌</h2>
        <input type="password" id="token" placeholder="ghp_… / github_pat_…" autocomplete="off" />
        <div class="row">
          <button id="saveToken" class="btn">Save / 保存</button>
          <button id="clearToken" class="btn-ghost">Clear / 清除</button>
        </div>
        <p class="hint" id="tokenHint"></p>
      </section>

      <section class="card">
        <div class="row" style="justify-content:space-between; align-items:center; margin-top:0;">
          <h2 style="margin:0;">Posts / 文章</h2>
          <button id="newPost" class="btn">+ New / 新建</button>
        </div>
        <p class="hint" id="listStatus" hidden></p>
        <ul id="postList"></ul>
      </section>
    </aside>

    <main class="admin-main">
      <div class="main-tabs">
        <button type="button" id="tabPosts" class="active">文章 Posts</button>
        <button type="button" id="tabSettings">站点资料 Settings</button>
      </div>

      <div id="postsView">
      <div id="modeBanner" class="warn" hidden></div>

      <section class="card">
        <div class="form-grid">
          <div class="field">
            <label>标题（中文）</label>
            <input id="title_zh" placeholder="文章中文标题" />
          </div>
          <div class="field">
            <label>Title (EN)</label>
            <input id="title" placeholder="English title" />
          </div>
          <div class="field">
            <label>slug（文章文件名）</label>
            <input id="slug" placeholder="my-post" />
          </div>
          <div class="field">
            <label>日期 date</label>
            <input id="date" type="date" />
          </div>
          <div class="field">
            <label>标签（中文，逗号分隔）</label>
            <input id="tags_zh" placeholder="产品, 随笔" />
          </div>
          <div class="field">
            <label>Tags (EN, comma-separated)</label>
            <input id="tags" placeholder="product, essay" />
          </div>
          <div class="field span2">
            <label>摘要（中文，可留空自动取正文首段）</label>
            <textarea id="excerpt_zh" rows="2"></textarea>
          </div>
          <div class="field span2">
            <label>Excerpt (EN, auto from first paragraph if empty)</label>
            <textarea id="excerpt" rows="2"></textarea>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="lang-tabs">
          <button type="button" data-lang-panel="zh" class="active">中文</button>
          <button type="button" data-lang-panel="en">EN</button>
        </div>
        <div class="editor-grid">
          <div class="editor-pane">
            <textarea id="bodyZh" class="editor" data-lang-panel="zh" placeholder="Markdown… 支持标题、列表、代码块、引用、表格"></textarea>
            <textarea id="bodyEn" class="editor" data-lang-panel="en" placeholder="Markdown…" hidden></textarea>
          </div>
          <iframe id="preview" class="preview" sandbox="" title="preview"></iframe>
        </div>
        <p class="hint">GFM supported: headings, lists, code blocks, blockquotes, tables, inline code. 图片请使用绝对路径 /assets/…</p>
      </section>

      <section class="actions">
        <button id="publish" class="btn">Publish / 发布</button>
        <button id="delete" class="btn danger" hidden>Delete / 删除</button>
        <button id="retryIndex" class="btn-ghost" hidden>Retry index / 重试索引</button>
        <span id="status" class="status"></span>
      </section>
      </div><!-- /#postsView -->

      <div id="settingsView" hidden>
        <section class="card">
          <div class="form-grid">
            <div class="field span2">
              <label>头像 Avatar</label>
              <div class="avatar-row">
                <img id="avatarPreview" class="avatar-preview" src="assets/img/avatar.svg" alt="avatar" />
                <div style="display:flex; flex-direction:column; gap:8px; flex:1;">
                  <div>
                    <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp,image/svg+xml" />
                    <button type="button" id="avatarUpload" class="btn">上传并保存到仓库 Upload</button>
                  </div>
                  <input id="avatarPath" placeholder="assets/img/avatar.svg 或 URL" />
                </div>
              </div>
              <p class="hint" id="avatarHint" hidden></p>
            </div>

            <div class="field">
              <label>姓名 Name</label>
              <input id="sName" placeholder="Jing Chen" />
            </div>
            <div class="field">
              <label>职位 Role（中文）</label>
              <input id="sRoleZh" placeholder="产品经理" />
            </div>
            <div class="field">
              <label>Role (EN)</label>
              <input id="sRoleEn" placeholder="Product Manager" />
            </div>
            <div class="field">
              <label>所在地 Location（中文，留空隐藏）</label>
              <input id="sLocZh" placeholder="中国" />
            </div>
            <div class="field">
              <label>Location (EN, empty to hide)</label>
              <input id="sLocEn" placeholder="China" />
            </div>

            <div class="field span2">
              <label>简介 Bio（中文）</label>
              <textarea id="sBioZh" rows="3"></textarea>
            </div>
            <div class="field span2">
              <label>Bio (EN)</label>
              <textarea id="sBioEn" rows="3"></textarea>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="row" style="justify-content:space-between; align-items:center; margin-top:0;">
            <h2 style="margin:0;">联系方式 Contacts</h2>
            <button type="button" id="addContact" class="btn-ghost">+ 添加 Add</button>
          </div>
          <div id="contactRows"></div>
        </section>

        <section class="card">
          <h2>页脚 Footer</h2>
          <div class="form-grid">
            <div class="field">
              <label>版权 Copyright</label>
              <input id="sCopyright" placeholder="© 2026 Jing Chen" />
            </div>
            <div class="field">
              <label>页脚说明（中文）</label>
              <input id="sFooterZh" placeholder="基于 GitHub Pages 构建" />
            </div>
            <div class="field">
              <label>Footer note (EN)</label>
              <input id="sFooterEn" placeholder="Built with GitHub Pages" />
            </div>
          </div>
        </section>

        <section class="actions">
          <button id="saveSettings" class="btn primary">保存并发布 Save settings</button>
          <span id="settingsStatus" class="status"></span>
        </section>
      </div><!-- /#settingsView -->
    </main>
  </div>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
