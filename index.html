<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jing Chen</title>
  <meta name="description" content="Jing Chen 的个人网站 — 产品经理。 / Personal website of Jing Chen — product manager." />
  <link rel="icon" href="assets/img/avatar.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!--
  DIRECTION — Engineering Spec Sheet (spec-sheet-world v1; seed: cf2d08f6 / dir 5)
  THESIS: The site reads as a precise product specification — hairline rules, mono
    data labels (ENTRY / REV / ID), one ink-blue accent, a clean reading column.
    It refuses the generic "minimal blog": no soft cards, no icon-tile hero.
  OWN-WORLD: ink #161b22 on paper white, blueprint-blue #1e54b3, faint construction
    grid in the header/footer margins, registration crosshairs at the corners,
    Space Grotesk (display) + Inter (body) + IBM Plex Mono (data).
  STORY: A reader lands, sees a spec sheet with entries, reads a post in a
    comfortable column, and knows Jing Chen is a precise, product-minded writer.
  FIRST VIEWPORT: brand + SPEC tag and hairline nav, sidebar as an engineering
    title block (ID / BASE / EMAIL rows), posts listed as ENTRY 01…02 with ISO dates.
  FORM: spec-sheet world, grounded direction 5 of the concept roll.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, and DESIGN.md.
  -->
  <div id="site-header"></div>

  <div class="container">
    <div class="home-grid">
      <div id="site-sidebar"></div>

      <main class="content">
        <h2 class="section-title">
          <span data-lang="zh">最新文章</span>
          <span data-lang="en" hidden>Recent Blog Posts</span>
        </h2>
        <ul class="post-list" id="js-posts" data-max="5"></ul>
        <a class="view-all" href="blog.html">
          <span data-lang="zh">查看全部文章 →</span>
          <span data-lang="en" hidden>View all posts →</span>
        </a>
      </main>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="assets/js/site-config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
